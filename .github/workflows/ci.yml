# CI: test -> lint -> config validation -> Docker build -> Trivy scan -> Docker Hub push.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - run: python -m pytest tests/ -q

  validate-configs:
    name: Validate configs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: promtool check (prometheus.yml + alert rules)
        run: |
          # NOTE: the prom/prometheus image entrypoint is the prometheus binary,
          # so promtool must be set as the entrypoint (passing it as an argument fails).
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.4.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.4.1 check rules /etc/prometheus/alerts.yml
      - name: amtool check (alertmanager.yml)
        run: |
          # Same entrypoint note as promtool: the alertmanager image entrypoint
          # is the alertmanager binary, so amtool must be the entrypoint.
          docker run --rm --entrypoint amtool -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Validate Grafana dashboard JSON
        run: python3 -c "import json; json.load(open('monitoring/grafana/dashboards/app-overview.json'))"

  helm:
    name: Helm lint + template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: helm lint helm/observability-stack
      - run: helm template release helm/observability-stack --set grafana.adminPassword=test-only > /dev/null

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-scan-push:
    name: Build, Trivy scan, push to Docker Hub
    runs-on: ubuntu-24.04
    needs: [test, validate-configs, helm, hadolint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        # NOTE: load:true uses the docker exporter, which cannot export a
        # multi-platform manifest list — so the scan build is amd64-only.
        # The push step below still builds all platforms for the registry.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: demo-app:ci
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        # NOTE: table format (not SARIF) so the log itself shows exactly what
        # tripped the gate — the SARIF file was never uploaded anywhere, and a
        # bare exit-code-1 with no visible findings is undebuggable (2026-10-17).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Check Docker Hub secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/TOKEN secrets missing — image push skipped."
          fi
      - name: Login to Docker Hub
        if: steps.secrets.outputs.present == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push to Docker Hub
        if: steps.secrets.outputs.present == 'true' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:sha-${{ github.sha }}
