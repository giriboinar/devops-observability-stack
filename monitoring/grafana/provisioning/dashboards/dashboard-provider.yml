# Grafana dashboard provisioning: JSON files under /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: "observability"
    orgId: 1
    folder: "Observability"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
