# Alert rules for the demo app + host. Validated in CI with promtool.
groups:
  - name: demo-app
    interval: 30s
    rules:
      - alert: AppDown
        expr: up{job="demo-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "demo-app is down ({{ $labels.instance }})"
          description: "Prometheus has failed to scrape demo-app for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(app_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(app_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on demo-app"
          description: "More than 5% of requests returned 5xx over the last 5 minutes."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(app_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s on demo-app"
          description: "95th percentile request latency exceeded 1 second for 5 minutes."

  - name: host
    interval: 30s
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage above 85% for 5 minutes."
